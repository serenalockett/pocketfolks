<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocketfolks Character Creator</title>
    
    <style>
        :root {
            --bg-warm-beige: #FAF8F5;
            --ui-sage-green: #F1F5EE;
            --ui-sage-dark: #6B7C65;
            --text-dark: #333C31;
            --accent-wood: #B45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-warm-beige);
            overflow: hidden;
            display: flex;
            width: 100vw;
            height: 100vh;
            color: var(--text-dark);
        }

        /* 3D Viewport Window */
        #canvas-container {
            flex: 1;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #ffffff 0%, #FAF8F5 100%);
        }

        /* Loading Overlay Overlay */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-warm-beige);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(107, 124, 101, 0.2);
            border-top: 4px solid var(--ui-sage-dark);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Premium Creator Sidebar */
        #sidebar {
            width: 380px;
            height: 100%;
            background-color: rgba(241, 245, 238, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid rgba(107, 124, 101, 0.15);
            display: flex;
            flex-direction: column;
            z-index: 5;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.02);
        }

        .sidebar-header {
            padding: 30px 25px 20px 25px;
            border-bottom: 1px solid rgba(107, 124, 101, 0.1);
        }

        .sidebar-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 0.85rem;
            color: var(--ui-sage-dark);
            opacity: 0.8;
        }

        .menu-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .control-group {
            margin-bottom: 30px;
        }

        .control-group h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: var(--ui-sage-dark);
            font-weight: 700;
        }

        /* Sliders Layout */
        .slider-wrapper {
            margin-bottom: 18px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .slider-input {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(107, 124, 101, 0.2);
            outline: none;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--ui-sage-dark);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Custom Color Pickers */
        .color-row {
            display: flex;
            gap: 12px;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(107, 124, 101, 0.1);
            margin-bottom: 12px;
        }

        .color-row span {
            font-size: 0.85rem;
            flex: 1;
            font-weight: 500;
        }

        .color-picker-custom {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 34px;
            height: 34px;
            background-none: none;
            border: none;
            cursor: pointer;
        }

        .color-picker-custom::-webkit-color-swatch {
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
        }

        /* Action Buttons */
        .footer-actions {
            padding: 20px 25px;
            border-top: 1px solid rgba(107, 124, 101, 0.1);
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--ui-sage-dark);
            color: white;
        }

        .btn-primary:hover {
            background-color: #556350;
            transform: translateY(-1px);
        }

        /* Quick instructions for mouse controls */
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0,0,0,0.05);
            pointer-events: none;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container">
        <div id="loading-screen">
            <div class="spinner"></div>
            <p style="font-size: 0.9rem; font-weight: 500; color: #6B7C65;">Preparing the workspace...</p>
        </div>
        <div class="controls-hint"> Left Click + Drag to rotate camera | Right Click to pan</div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Pocketfolks</h1>
            <p>Character Customization Prototype</p>
        </div>

        <div class="menu-content">
            <div class="control-group">
                <h3>Proportions</h3>
                
                <div class="slider-wrapper">
                    <div class="slider-label"><span>Height</span><span id="val-height">1.00x</span></div>
                    <input type="range" id="scale-height" class="slider-input" min="0.8" max="1.2" step="0.01" value="1">
                </div>

                <div class="slider-wrapper">
                    <div class="slider-label"><span>Body Width</span><span id="val-width">1.00x</span></div>
                    <input type="range" id="scale-width" class="slider-input" min="0.7" max="1.3" step="0.01" value="1">
                </div>

                <div class="slider-wrapper">
                    <div class="slider-label"><span>Head Size</span><span id="val-head">1.00x</span></div>
                    <input type="range" id="scale-head-size" class="slider-input" min="0.8" max="1.2" step="0.01" value="1">
                </div>
            </div>

            <div class="control-group">
                <h3>Color Palette</h3>
                
                <div class="color-row">
                    <span>Skin Tone</span>
                    <input type="color" id="color-skin" class="color-picker-custom" value="#E2B997">
                </div>

                <div class="color-row">
                    <span>Hair Color</span>
                    <input type="color" id="color-hair" class="color-picker-custom" value="#4A3728">
                </div>

                <div class="color-row">
                    <span>Top Clothing</span>
                    <input type="color" id="color-top" class="color-picker-custom" value="#FAF8F5">
                </div>

                <div class="color-row">
                    <span>Bottom Clothing</span>
                    <input type="color" id="color-bottom" class="color-picker-custom" value="#F1F5EE">
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="btn btn-primary" onclick="alert('Pocketfolk DNA saved successfully!')">Save Character</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let pocketfolkGroup, headMesh, bodyMesh, leftArm, rightArm, hairMesh, topMesh, bottomMesh;

        // Initialize Engine
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Build Base Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#FAF8F5');

            // 2. Camera Configuration
            camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 1.2, 3.5);

            // 3. Setup Renderer with Soft Shadows Enabled
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Smooth Camera Controls Configuration
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; // Block camera from going underground
            controls.minDistance = 1.5;
            controls.maxDistance = 6;
            controls.target.set(0, 1.0, 0);

            // 5. Ambient Lighting Setups (Soft Matte Look Architecture)
            const ambientLight = new THREE.AmbientLight('#ffffff', 0.65);
            scene.add(ambientLight);

            // Main Soft Sun Rig
            const sunLight = new THREE.DirectionalLight('#FFF9E6', 0.8);
            sunLight.position.set(5, 8, 5);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.bias = -0.0001;
            scene.add(sunLight);

            // Soft Ground Bounce Light Fill
            const fillLight = new THREE.DirectionalLight('#E2E8F0', 0.3);
            fillLight.position.set(-5, 2, -5);
            scene.add(fillLight);

            // Subtle Floor/Studio Platform
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.06 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 6. Assemble Procedural Character Geometry Blueprint
            createCharacter();

            // Dismantle loading screen safely
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);

            // Hook up UI listeners
            setupUIListeners();

            // Run core frame engine loop
            animate();
        }

        function createCharacter() {
            pocketfolkGroup = new THREE.Group();
            scene.add(pocketfolkGroup);

            // Setup Soft Matte Materials
            const materials = {
                skin: new THREE.MeshLambertMaterial({ color: 0xE2B997 }),
                hair: new THREE.MeshLambertMaterial({ color: 0x4A3728 }),
                top: new THREE.MeshLambertMaterial({ color: 0xFAF8F5 }),
                bottom: new THREE.MeshLambertMaterial({ color: 0xF1F5EE })
            };

            // Main Torso Body Component
            const bodyGeo = new THREE.CylinderGeometry(0.2, 0.15, 0.6, 16);
            bodyMesh = new THREE.Mesh(bodyGeo, materials.skin);
            bodyMesh.position.y = 0.65;
            bodyMesh.castShadow = true;
            pocketfolkGroup.add(bodyMesh);

            // Top Shirt Layer
            const topGeo = new THREE.CylinderGeometry(0.21, 0.19, 0.35, 16);
            topMesh = new THREE.Mesh(topGeo, materials.top);
            topMesh.position.y = 0.13;
            bodyMesh.add(topMesh);

            // Pants Layer
            const bottomGeo = new THREE.CylinderGeometry(0.185, 0.155, 0.22, 16);
            bottomMesh = new THREE.Mesh(bottomGeo, materials.bottom);
            bottomMesh.position.y = -0.16;
            bodyMesh.add(bottomMesh);

            // Head Node Structure
            const headGeo = new THREE.SphereGeometry(0.22, 32, 32);
            headMesh = new THREE.Mesh(headGeo, materials.skin);
            headMesh.position.y = 0.42; // Anchored relative to the torso
            headMesh.castShadow = true;
            bodyMesh.add(headMesh);

            // Minimalist Illustrated Hair Volumetric Shape
            const hairGeo = new THREE.SphereGeometry(0.23, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.6);
            hairMesh = new THREE.Mesh(hairGeo, materials.hair);
            hairMesh.position.set(0, 0.03, -0.01);
            hairMesh.rotation.x = -0.2;
            headMesh.add(hairMesh);

            // Arm Left Component
            const armGeo = new THREE.CylinderGeometry(0.05, 0.04, 0.35, 8);
            leftArm = new THREE.Mesh(armGeo, materials.skin);
            leftArm.position.set(-0.26, 0.1, 0);
            leftArm.rotation.z = 0.15;
            leftArm.castShadow = true;
            bodyMesh.add(leftArm);

            // Arm Right Component
            rightArm = leftArm.clone();
            rightArm.position.x = 0.26;
            rightArm.rotation.z = -0.15;
            bodyMesh.add(rightArm);
        }

        // Connect Interface Nodes to 3D Vertex Engine Matrix
        function setupUIListeners() {
            // Height Multiplier Setup
            document.getElementById('scale-height').addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                bodyMesh.scale.y = val;
                // Reverse counteract head scaling to preserve standard head shape dimensions
                headMesh.scale.y = 1 / val; 
                leftArm.scale.y = 1 / val;
                rightArm.scale.y = 1 / val;
                document.getElementById('val-height').innerText = val.toFixed(2) + 'x';
            });

            // Lateral Width Slider Link
            document.getElementById('scale-width').addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                bodyMesh.scale.x = val;
                bodyMesh.scale.z = val;
                // Preserve proportional head scale ratios during torso transformations
                headMesh.scale.x = 1 / val;
                headMesh.scale.z = 1 / val;
                document.getElementById('val-width').innerText = val.toFixed(2) + 'x';
            });

            // Independent Cranial Scaling Slider
            document.getElementById('scale-head-size').addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                headMesh.scale.set(val, (1 / bodyMesh.scale.y) * val, val);
                document.getElementById('val-head').innerText = val.toFixed(2) + 'x';
            });

            // Color System Vector Updates
            document.getElementById('color-skin').addEventListener('input', (e) => {
                bodyMesh.material.color.set(e.target.value);
                headMesh.material.color.set(e.target.value);
                leftArm.material.color.set(e.target.value);
                rightArm.material.color.set(e.target.value);
            });

            document.getElementById('color-hair').addEventListener('input', (e) => {
                hairMesh.material.color.set(e.target.value);
            });

            document.getElementById('color-top').addEventListener('input', (e) => {
                topMesh.material.color.set(e.target.value);
            });

            document.getElementById('color-bottom').addEventListener('input', (e) => {
                bottomMesh.material.color.set(e.target.value);
            });

            // Dynamic Window Adjustment Listener
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // Core Render Execution Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize on DOM load
        window.onload = init;
    </script>
</body>
</html>
