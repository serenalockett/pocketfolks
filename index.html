<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocketfolks - Character Creator</title>
    
    <style>
        :root {
            --bg-warm: #FAF8F5;
            --ui-sage: #F1F5EE;
            --ui-dark: #333C31;
            --ui-sage-dark: #6B7C65;
            --panel-shadow: 0 10px 30px rgba(51, 60, 49, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-warm);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--ui-dark);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Top HUD Title Bar */
        #hud-header {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
        }

        #hud-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }

        #hud-header p {
            font-size: 0.85rem;
            color: var(--ui-sage-dark);
            font-weight: 500;
        }

        /* Contextual Floating Pop-out Panels (Paralives Style) */
        .context-menu {
            position: absolute;
            z-index: 10;
            background: rgba(241, 245, 238, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(107, 124, 101, 0.15);
            padding: 20px;
            border-radius: 20px;
            width: 260px;
            box-shadow: var(--panel-shadow);
            opacity: 0;
            transform: scale(0.9) translateY(10px);
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .context-menu.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .menu-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ui-sage-dark);
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(107, 124, 101, 0.1);
            padding-bottom: 6px;
        }

        /* Sliders and Feature Pickers */
        .feature-row {
            margin-bottom: 14px;
        }

        .feature-row label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(107, 124, 101, 0.2);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--ui-sage-dark);
            cursor: pointer;
        }

        /* Color Circle Button Layout */
        .color-palette-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        /* Ambient Instruction Guide */
        #guide-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(51, 60, 49, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            pointer-events: none;
            color: var(--ui-sage-dark);
            border: 1px solid rgba(107, 124, 101, 0.1);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="hud-header">
        <h1>Pocketfolks</h1>
        <p>Interactive Reshaping Engine</p>
    </div>

    <div id="canvas-container"></div>

    <div id="guide-overlay">✦ Click directly on the Hair, Face, or Neck to open reshaping controls</div>

    <div id="menu-face" class="context-menu">
        <div class="menu-title">Face Matrix</div>
        <div class="feature-row">
            <label>Face Width <span id="txt-face-width">0%</span></label>
            <input type="range" id="morph-face-width" class="slider" min="-0.3" max="0.3" step="0.01" value="0">
        </div>
        <div class="feature-row">
            <label>Chin Depth <span id="txt-chin-depth">0%</span></label>
            <input type="range" id="morph-chin-depth" class="slider" min="-0.2" max="0.3" step="0.01" value="0">
        </div>
        <div class="feature-row">
            <label>Skin Tone</label>
            <div class="color-palette-row">
                <div class="color-dot" style="background: #E2B997;" onclick="changeColor('face', '#E2B997')"></div>
                <div class="color-dot" style="background: #F3D2B9;" onclick="changeColor('face', '#F3D2B9')"></div>
                <div class="color-dot" style="background: #C6936E;" onclick="changeColor('face', '#C6936E')"></div>
                <div class="color-dot" style="background: #8A5A36;" onclick="changeColor('face', '#8A5A36')"></div>
            </div>
        </div>
    </div>

    <div id="menu-hair" class="context-menu">
        <div class="menu-title">Hair Volume</div>
        <div class="feature-row">
            <label>Hair Puff <span id="txt-hair-puff">0%</span></label>
            <input type="range" id="morph-hair-puff" class="slider" min="-0.1" max="0.4" step="0.01" value="0">
        </div>
        <div class="feature-row">
            <label>Hair Height <span id="txt-hair-height">0%</span></label>
            <input type="range" id="morph-hair-height" class="slider" min="-0.1" max="0.3" step="0.01" value="0">
        </div>
        <div class="feature-row">
            <label>Hair Swatch</label>
            <div class="color-palette-row">
                <div class="color-dot" style="background: #4A3728;" onclick="changeColor('hair', '#4A3728')"></div>
                <div class="color-dot" style="background: #222222;" onclick="changeColor('hair', '#222222')"></div>
                <div class="color-dot" style="background: #C49A6C;" onclick="changeColor('hair', '#C49A6C')"></div>
                <div class="color-dot" style="background: #9E4F3F;" onclick="changeColor('hair', '#9E4F3F')"></div>
            </div>
        </div>
    </div>

    <div id="menu-neck" class="context-menu">
        <div class="menu-title">Proportions</div>
        <div class="feature-row">
            <label>Neck Thickness <span id="txt-neck-thick">0%</span></label>
            <input type="range" id="morph-neck-thick" class="slider" min="-0.05" max="0.1" step="0.01" value="0">
        </div>
        <div class="feature-row">
            <label>Neck Height <span id="txt-neck-height">0%</span></label>
            <input type="range" id="morph-neck-height" class="slider" min="-0.1" max="0.2" step="0.01" value="0">
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let faceMesh, hairMesh, neckMesh;
        let activeMenu = null;

        // Arrays to preserve original vertex structures for dynamic morphing
        let baseFaceVertices = [], baseHairVertices = [], baseNeckVertices = [];

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#FAF8F5');

            camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 0.4, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.35, 0);
            controls.enablePan = false;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Set up sophisticated, ambient lighting (Soft PBR style)
            const ambientLight = new THREE.AmbientLight('#ffffff', 0.7);
            scene.add(ambientLight);

            const studioLight = new THREE.DirectionalLight('#FFF5EB', 0.65);
            studioLight.position.set(4, 6, 4);
            scene.add(studioLight);

            const softFill = new THREE.DirectionalLight('#E2E8F0', 0.35);
            softFill.position.set(-4, 2, -4);
            scene.add(softFill);

            // Build human-like mesh structures
            buildPocketfolkModels();

            // Event Hooks
            container.addEventListener('pointerdown', onModelClick);
            window.addEventListener('resize', onWindowResize);
            setupMorphControls();

            animate();
        }

        function buildPocketfolkModels() {
            // Setup true matte materials matching your palette preference
            const skinMaterial = new THREE.MeshLambertMaterial({ color: 0xE2B997, roughness: 0.9 });
            const hairMaterial = new THREE.MeshLambertMaterial({ color: 0x4A3728, roughness: 0.85 });

            // 1. Procedural Human-Style Head Mesh (Softer than basic shapes)
            const faceGeo = new THREE.SphereGeometry(0.24, 32, 24);
            // Sculpt the sphere into an organic jaw/face shape instantly via code
            const posAttr = faceGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                let x = posAttr.getX(i);
                let y = posAttr.getY(i);
                let z = posAttr.getZ(i);
                
                // Taper the chin slightly downward/forward
                if (y < 0) {
                    x *= (1 + y * 0.3);
                    z *= (1 + y * 0.1);
                }
                posAttr.setXYZ(i, x, y, z);
                baseFaceVertices.push(new THREE.Vector3(x, y, z));
            }
            faceGeo.computeVertexNormals();
            faceMesh = new THREE.Mesh(faceGeo, skinMaterial);
            faceMesh.position.y = 0.4;
            faceMesh.name = "face";
            scene.add(faceMesh);

            // 2. Volumetric Soft Hair Layer
            const hairGeo = new THREE.SphereGeometry(0.255, 24, 20, 0, Math.PI * 2, 0, Math.PI * 0.65);
            const hairPos = hairGeo.attributes.position;
            for(let i=0; i<hairPos.count; i++) {
                let x = hairPos.getX(i);
                let y = hairPos.getY(i);
                let z = hairPos.getZ(i);
                // Bulk out the back/top volume
                if (y > 0) { y *= 1.05; }
                hairPos.setXYZ(i, x, y, z);
                baseHairVertices.push(new THREE.Vector3(x, y, z));
            }
            hairGeo.computeVertexNormals();
            hairMesh = new THREE.Mesh(hairGeo, hairMaterial);
            hairMesh.position.set(0, 0.04, -0.02);
            hairMesh.rotation.x = -0.15;
            hairMesh.name = "hair";
            faceMesh.add(hairMesh);

            // 3. Anatomical Neck Base
            const neckGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.25, 16);
            const neckPos = neckGeo.attributes.position;
            for(let i=0; i<neckPos.count; i++) {
                baseNeckVertices.push(new THREE.Vector3(neckPos.getX(i), neckPos.getY(i), neckPos.getZ(i)));
            }
            neckMesh = new THREE.Mesh(neckGeo, skinMaterial);
            neckMesh.position.y = 0.16;
            neckMesh.name = "neck";
            scene.add(neckMesh);
        }

        // Raycasting Logic: Identifies clicked model part & builds a floating link UI
        function onModelClick(event) {
            // Disregard clicks hitting active panel menus
            if(event.target.closest('.context-menu')) return;

            const container = document.getElementById('canvas-container');
            mouse.x = (event.clientX / container.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / container.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([faceMesh, hairMesh, neckMesh], true);

            if (intersects.length > 0) {
                // Determine core object hit name
                let targetObj = intersects[0].object;
                if(targetObj.name === "") targetObj = targetObj.parent; // Catch children variations
                
                showFloatingMenu(targetObj.name, event.clientX, event.clientY);
            } else {
                hideActiveMenu();
            }
        }

        function showFloatingMenu(partName, clickX, clickY) {
            hideActiveMenu();

            const menu = document.getElementById(`menu-${partName}`);
            if (!menu) return;

            // Offset the panel so it floats elegantly alongside the cursor context
            menu.style.left = `${clickX + 25}px`;
            menu.style.top = `${clickY - 50}px`;
            menu.classList.add('active');
            activeMenu = menu;
        }

        function hideActiveMenu() {
            if (activeMenu) {
                activeMenu.classList.remove('active');
                activeMenu = null;
            }
        }

        // Real-Time Parametric Morphing Scripts (Reshaping without distortions)
        function setupMorphControls() {
            // Face Morphing Logic
            document.getElementById('morph-face-width').addEventListener('input', (e) => {
                const amount = parseFloat(e.target.value);
                document.getElementById('txt-face-width').innerText = Math.round(amount * 100) + '%';
                
                const pos = faceMesh.geometry.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    let base = baseFaceVertices[i];
                    // Stretch vertices outward horizontally based on the slider value
                    pos.setX(i, base.x * (1 + amount));
                }
                pos.needsUpdate = true;
            });

            document.getElementById('morph-chin-depth').addEventListener('input', (e) => {
                const amount = parseFloat(e.target.value);
                document.getElementById('txt-chin-depth').innerText = Math.round(amount * 100) + '%';
                
                const pos = faceMesh.geometry.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    let base = baseFaceVertices[i];
                    // Pull lower chin jaw vertices forward or backward dynamically
                    if(base.y < 0) {
                        pos.setZ(i, base.z + (amount * Math.abs(base.y)));
                    }
                }
                pos.needsUpdate = true;
            });

            // Hair Morphing Logic
            document.getElementById('morph-hair-puff').addEventListener('input', (e) => {
                const amount = parseFloat(e.target.value);
                document.getElementById('txt-hair-puff').innerText = Math.round(amount * 100) + '%';
                
                const pos = hairMesh.geometry.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    let base = baseHairVertices[i];
                    pos.setX(i, base.x * (1 + amount));
                    pos.setZ(i, base.z * (1 + amount));
                }
                pos.needsUpdate = true;
            });

            document.getElementById('morph-hair-height').addEventListener('input', (e) => {
                const amount = parseFloat(e.target.value);
                document.getElementById('txt-hair-height').innerText = Math.round(amount * 100) + '%';
                
                const pos = hairMesh.geometry.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    let base = baseHairVertices[i];
                    if(base.y > 0) {
                        pos.setY(i, base.y * (1 + amount));
                    }
                }
                pos.needsUpdate = true;
            });

            // Neck Morphing Logic
            document.getElementById('morph-neck-thick').addEventListener('input', (e) => {
                const amount = parseFloat(e.target.value);
                document.getElementById('txt-neck-thick').innerText = Math.round(amount * 100) + '%';
                
                const pos = neckMesh.geometry.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    let base = baseNeckVertices[i];
                    pos.setX(i, base.x * (1 + amount * 5));
                    pos.setZ(i, base.z * (1 + amount * 5));
                }
                pos.needsUpdate = true;
            });

            document.getElementById('morph-neck-height').addEventListener('input', (e) => {
                const amount = parseFloat(e.target.value);
                document.getElementById('txt-neck-height').innerText = Math.round(amount * 100) + '%';
                
                const pos = neckMesh.geometry.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    let base = baseNeckVertices[i];
                    pos.setY(i, base.y * (1 + amount));
                }
                pos.needsUpdate = true;
            });
        }

        // Palette Hex Pipeline
        window.changeColor = function(part, hexColor) {
            if (part === 'face') {
                faceMesh.material.color.set(hexColor);
                neckMesh.material.color.set(hexColor);
            } else if (part === 'hair') {
                hairMesh.material.color.set(hexColor);
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
