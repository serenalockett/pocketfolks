<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocketfolks - 2D Vector Customizer</title>
    <style>
        :root {
            --bg-warm: #FAF8F5;
            --ui-sage: #F1F5EE;
            --ui-dark: #333C31;
            --ui-sage-dark: #6B7C65;
            --panel-shadow: 0 12px 40px rgba(51, 60, 49, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-warm);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--ui-dark);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #hud-header {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: none;
        }

        #hud-header h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }

        #hud-header p {
            font-size: 0.9rem;
            color: var(--ui-sage-dark);
            font-weight: 500;
        }

        /* SVG Character Viewport */
        #character-canvas {
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 600px;
            z-index: 1;
        }

        /* Interactive Vector Path Rules */
        .interactive-part {
            cursor: pointer;
            transition: filter 0.2s ease, opacity 0.2s ease;
        }

        .interactive-part:hover {
            filter: brightness(1.03);
            opacity: 0.95;
        }

        /* Contextual Floating Menus */
        .context-menu {
            position: absolute;
            z-index: 10;
            background: rgba(241, 245, 238, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(107, 124, 101, 0.15);
            padding: 22px;
            border-radius: 24px;
            width: 260px;
            box-shadow: var(--panel-shadow);
            opacity: 0;
            transform: scale(0.92) translateY(10px);
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .context-menu.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .menu-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ui-sage-dark);
            font-weight: 700;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(107, 124, 101, 0.1);
            padding-bottom: 6px;
        }

        .feature-row {
            margin-bottom: 16px;
        }

        .feature-row label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(107, 124, 101, 0.18);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--ui-sage-dark);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* Swatches matching your design preferences */
        .color-palette-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(51,60,49,0.12);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .color-dot:hover {
            transform: scale(1.18);
        }

        #guide-overlay {
            position: absolute;
            bottom: 40px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            pointer-events: none;
            color: var(--ui-sage-dark);
            border: 1px solid rgba(107, 124, 101, 0.12);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>

    <div id="hud-header">
        <h1>Pocketfolks</h1>
        <p>Illustrative Vector Engine</p>
    </div>

    <svg id="character-canvas" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <g id="character-group" transform="translate(0, 10)">
            
            <path id="part-hair-back" class="interactive-part" data-part="hair" fill="#4A3728" 
                d="M 140 170 C 110 130, 120 70, 200 70 C 280 70, 290 130, 260 170 Z"/>

            <path id="part-clothing" class="interactive-part" data-part="clothing" fill="#F1F5EE" 
                d="M 130 350 C 130 290, 150 250, 170 240 L 170 210 L 230 210 L 230 240 C 250 250, 270 290, 270 350 Z"/>

            <path id="part-skin" class="interactive-part" data-part="face" fill="#E2B997" 
                d="M 175 220 L 175 195 C 150 190, 145 140, 155 120 C 165 95, 235 95, 245 120 C 255 140, 250 190, 225 195 L 225 220 Z"/>

            <g id="face-features" pointer-events="none">
                <ellipse id="eye-left" cx="180" cy="145" rx="4" ry="6" fill="#333C31" />
                <ellipse id="eye-right" cx="220" cy="145" rx="4" ry="6" fill="#333C31" />
                
                <circle cx="168" cy="156" r="7" fill="#EAAAA0" opacity="0.35"/>
                <circle cx="232" cy="156" r="7" fill="#EAAAA0" opacity="0.35"/>
            </g>

            <path id="part-hair-front" class="interactive-part" data-part="hair" fill="#4A3728" 
                d="M 145 120 C 140 90, 170 65, 200 65 C 230 65, 260 90, 255 120 C 240 100, 220 105, 200 115 C 180 105, 160 100, 145 120 Z"/>

        </g>
    </svg>

    <div id="guide-overlay">✦ Click on Hair, Face, or Clothes to open floating menus</div>

    <div id="menu-face" class="context-menu">
        <div class="menu-title">Face Profile</div>
        <div class="feature-row">
            <label>Eye Spacing <span id="txt-eye-space">0px</span></label>
            <input type="range" id="morph-eye-space" class="slider" min="-12" max="15" step="1" value="0">
        </div>
        <div class="feature-row">
            <label>Skin Tone</label>
            <div class="color-palette-row">
                <div class="color-dot" style="background: #E2B997;" onclick="changeColor('skin', '#E2B997')"></div>
                <div class="color-dot" style="background: #F3D2B9;" onclick="changeColor('skin', '#F3D2B9')"></div>
                <div class="color-dot" style="background: #C6936E;" onclick="changeColor('skin', '#C6936E')"></div>
            </div>
        </div>
    </div>

    <div id="menu-hair" class="context-menu">
        <div class="menu-title">Hair Volume</div>
        <div class="feature-row">
            <label>Hair Puff <span id="txt-hair-scale">1.0x</span></label>
            <input type="range" id="morph-hair-scale" class="slider" min="0.85" max="1.25" step="0.01" value="1">
        </div>
        <div class="feature-row">
            <label>Hair Tones</label>
            <div class="color-palette-row">
                <div class="color-dot" style="background: #4A3728;" onclick="changeColor('hair', '#4A3728')"></div>
                <div class="color-dot" style="background: #C49A6C;" onclick="changeColor('hair', '#C49A6C')"></div>
                <div class="color-dot" style="background: #222222;" onclick="changeColor('hair', '#222222')"></div>
            </div>
        </div>
    </div>

    <div id="menu-clothing" class="context-menu">
        <div class="menu-title">Clothing Style</div>
        <div class="feature-row">
            <label>Shoulder Width <span id="txt-shoulder-width">0px</span></label>
            <input type="range" id="morph-shoulder" class="slider" min="-25" max="35" step="1" value="0">
        </div>
        <div class="feature-row">
            <label>Top Swatch</label>
            <div class="color-palette-row">
                <div class="color-dot" style="background: #F1F5EE;" onclick="changeColor('clothing', '#F1F5EE')"></div>
                <div class="color-dot" style="background: #9BB0A5;" onclick="changeColor('clothing', '#9BB0A5')"></div>
                <div class="color-dot" style="background: #D4C5B9;" onclick="changeColor('clothing', '#D4C5B9')"></div>
            </div>
        </div>
    </div>

    <script>
        let activeMenu = null;

        // Save default vector map coordinates for real-time morph shifting calculations
        const baseEyeLeftX = 180;
        const baseEyeRightX = 220;

        document.querySelectorAll('.interactive-part').forEach(part => {
            part.addEventListener('click', (e) => {
                e.stopPropagation();
                const partType = part.getAttribute('data-part');
                showFloatingMenu(partType, e.clientX, e.clientY);
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.context-menu')) {
                hideActiveMenu();
            }
        });

        function showFloatingMenu(type, x, y) {
            hideActiveMenu();
            const menu = document.getElementById(`menu-${type}`);
            if (!menu) return;

            menu.style.left = `${Math.min(x + 20, window.innerWidth - 280)}px`;
            menu.style.top = `${Math.min(y - 40, window.innerHeight - 240)}px`;
            menu.classList.add('active');
            activeMenu = menu;
        }

        function hideActiveMenu() {
            if (activeMenu) {
                activeMenu.classList.remove('active');
                activeMenu = null;
            }
        }

        // --- Real-time Organic Mathematical Deformations ---
        
        // 1. Reshape Eye Spacing
        document.getElementById('morph-eye-space').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('txt-eye-space').innerText = val + 'px';
            
            document.getElementById('eye-left').setAttribute('cx', baseEyeLeftX - val);
            document.getElementById('eye-right').setAttribute('cx', baseEyeRightX + val);
        });

        // 2. Reshape Shoulder / Chest Width Profile
        document.getElementById('morph-shoulder').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('txt-shoulder-width').innerText = val + 'px';
            
            const clothingPath = document.getElementById('part-clothing');
            // Dynamically alter the exact path coordinate nodes of the custom shirt vector path string
            const leftTargetX = 130 - val;
            const rightTargetX = 270 + val;
            const newPath = `M ${leftTargetX} 350 C ${leftTargetX} 290, 150 250, 170 210 L 230 210 C 250 250, ${rightTargetX} 290, ${rightTargetX} 350 Z`;
            clothingPath.setAttribute('d', newPath);
        });

        // 3. Reshape Hair Puff / Scaling volume instantly
        document.getElementById('morph-hair-scale').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('txt-hair-scale').innerText = val.toFixed(2) + 'x';
            
            const backHair = document.getElementById('part-hair-back');
            const frontHair = document.getElementById('part-hair-front');
            
            // Scaled smoothly from the top center core of the skull array matrix
            backHair.style.transformOrigin = "200px 120px";
            frontHair.style.transformOrigin = "200px 120px";
            backHair.style.transform = `scale(${val})`;
            frontHair.style.transform = `scale(${val})`;
        });

        // Color Palette Node Updates
        window.changeColor = function(part, hex) {
            if (part === 'skin') {
                document.getElementById('part-skin').setAttribute('fill', hex);
            } else if (part === 'hair') {
                document.getElementById('part-hair-back').setAttribute('fill', hex);
                document.getElementById('part-hair-front').setAttribute('fill', hex);
            } else if (part === 'clothing') {
                document.getElementById('part-clothing').setAttribute('fill', hex);
            }
        }
    </script>
</body>
</html>
