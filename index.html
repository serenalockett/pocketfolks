<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocketfolks - Illustrative Customizer</title>
    <style>
        :root {
            --bg-cozy: #FAF8F5;
            --ui-sage: #F1F5EE;
            --ui-dark: #333C31;
            --ui-sage-dark: #6B7C65;
            --sunlight: rgba(255, 190, 90, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-cozy);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--ui-dark);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #hud-header {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: none;
        }

        #hud-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }

        #hud-header p {
            font-size: 0.85rem;
            color: var(--ui-sage-dark);
        }

        /* The Illustration Canvas Window */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #character-svg {
            width: 100%;
            height: 100%;
        }

        /* Painterly Styling Rules (Lineless Art Setup) */
        .vector-part {
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        /* Soft, blended ambient shadows instead of harsh black outlines */
        .shadow-blend {
            filter: drop-shadow(0px 8px 12px rgba(74, 55, 40, 0.25));
        }

        /* Cinematic Overlays applied via CSS Graphics */
        .sunlight-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--sunlight) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            mix-blend-mode: color-burn; /* Bakes the golden sun directly into the colors */
        }

        .grain-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3联%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Contextual Floating Menus */
        .context-menu {
            position: absolute;
            z-index: 10;
            background: rgba(241, 245, 238, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(107, 124, 101, 0.15);
            padding: 20px;
            border-radius: 24px;
            width: 250px;
            opacity: 0;
            transform: scale(0.92) translateY(10px);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 15px 35px rgba(51, 60, 49, 0.08);
        }

        .context-menu.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .menu-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ui-sage-dark);
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(107, 124, 101, 0.1);
            padding-bottom: 4px;
        }

        .feature-row { margin-bottom: 14px; }
        .feature-row label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }
        
        .slider {
            width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
            background: rgba(107, 124, 101, 0.18); outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
            background: var(--ui-sage-dark); cursor: pointer;
        }

        .color-palette { display: flex; gap: 8px; margin-top: 6px; }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }

        #guide-overlay {
            position: absolute; bottom: 40px; z-index: 10; background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; font-weight: 500;
            pointer-events: none; color: var(--ui-sage-dark); border: 1px solid rgba(107, 124, 101, 0.1);
        }
    </style>
</head>
<body>

    <div id="hud-header">
        <h1>Pocketfolks</h1>
        <p>Painterly Customization Prototype</p>
    </div>

    <div id="canvas-wrapper">
        <svg id="character-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
            <path id="part-torso" class="vector-part shadow-blend" data-part="torso" fill="#EAAA95" 
                d="M 120 480 C 120 380, 140 330, 165 310 L 165 250 L 235 250 L 235 310 C 260 330, 280 380, 280 480 Z"/>
            
            <path id="part-head" class="vector-part shadow-blend" data-part="head" fill="#8A5A36" 
                d="M 170 250 L 170 210 C 145 200, 140 140, 160 110 C 180 80, 220 80, 240 110 C 260 140, 255 200, 230 210 L 230 250 Z"/>
            
            <path id="part-hair" class="vector-part" data-part="hair" fill="#1C1612" 
                d="M 150 130 C 130 90, 160 50, 200 50 C 240 50, 270 90, 250 130 C 235 110, 220 105, 200 110 C 180 105, 165 110, 150 130 Z"/>
        </svg>

        <div class="sunlight-overlay"></div>
        <div class="grain-texture"></div>
    </div>

    <div id="guide-overlay">✦ Click on the Hair, Head/Neck, or Torso to reshape the art</div>

    <div id="menu-head" class="context-menu">
        <div class="menu-title">Head & Neck</div>
        <div class="feature-row">
            <label>Neck Elegance <span id="txt-neck-width">0%</span></label>
            <input type="range" id="slider-neck-width" class="slider" min="-15" max="15" step="1" value="0">
        </div>
        <div class="feature-row">
            <label>Skin Tone</label>
            <div class="color-palette">
                <div class="color-dot" style="background: #8A5A36;" onclick="changeColor('skin', '#8A5A36')"></div>
                <div class="color-dot" style="background: #A36A43;" onclick="changeColor('skin', '#A36A43')"></div>
                <div class="color-dot" style="background: #C68B5C;" onclick="changeColor('skin', '#C68B5C')"></div>
            </div>
        </div>
    </div>

    <div id="menu-hair" class="context-menu">
        <div class="menu-title">Hair Crown</div>
        <div class="feature-row">
            <label>Hair Puff <span id="txt-hair-puff">1.0x</span></label>
            <input type="range" id="slider-hair-puff" class="slider" min="0.85" max="1.3" step="0.01" value="1">
        </div>
    </div>

    <div id="menu-torso" class="context-menu">
        <div class="menu-title">Shoulder Frame</div>
        <div class="feature-row">
            <label>Shoulder Slop <span id="txt-shoulder">0%</span></label>
            <input type="range" id="slider-shoulder" class="slider" min="-20" max="25" step="1" value="0">
        </div>
        <div class="feature-row">
            <label>Clothing Tone</label>
            <div class="color-palette">
                <div class="color-dot" style="background: #EAAA95;" onclick="changeColor('clothing', '#EAAA95')"></div>
                <div class="color-dot" style="background: #F1F5EE;" onclick="changeColor('clothing', '#F1F5EE')"></div>
                <div class="color-dot" style="background: #6B7C65;" onclick="changeColor('clothing', '#6B7C65')"></div>
            </div>
        </div>
    </div>

    <script>
        let currentMenu = null;

        // Interactive click detection links straight to individual shape configurations
        document.querySelectorAll('.vector-part').forEach(part => {
            part.addEventListener('click', (e) => {
                e.stopPropagation();
                const partType = part.getAttribute('data-part');
                showMenu(partType, e.clientX, e.clientY);
            });
        });

        document.addEventListener('click', () => hideMenu());

        function showMenu(type, x, y) {
            hideMenu();
            const menu = document.getElementById(`menu-${type}`);
            if (!menu) return;
            menu.style.left = `${Math.min(x + 20, window.innerWidth - 270)}px`;
            menu.style.top = `${Math.min(y - 40, window.innerHeight - 220)}px`;
            menu.classList.add('active');
            currentMenu = menu;
        }

        function hideMenu() { if (currentMenu) { currentMenu.classList.remove('active'); currentMenu = null; } }

        // Real-Time Vector Node Reshaping Actions
        document.getElementById('slider-neck-width').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('txt-neck-width').innerText = val + '%';
            
            const headPath = document.getElementById('part-head');
            const leftNeckX = 170 + val;
            const rightNeckX = 230 - val;
            
            // Recalculates the custom curved path anchor string smoothly
            const newPath = `M ${leftNeckX} 250 L ${leftNeckX} 210 C 145 200, 140 140, 160 110 C 180 80, 220 80, 240 110 C 260 140, 255 200, ${rightNeckX} 210 L ${rightNeckX} 250 Z`;
            headPath.setAttribute('d', newPath);
        });

        document.getElementById('slider-shoulder').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('txt-shoulder').innerText = val + '%';
            
            const torsoPath = document.getElementById('part-torso');
            const leftShoulderX = 120 - val;
            const leftShoulderY = 310 + val;
            const rightShoulderX = 280 + val;
            const rightShoulderY = 310 + val;
            
            const newPath = `M 120 480 C 120 380, ${leftShoulderX} ${leftShoulderY}, 165 310 L 165 250 L 235 250 L 235 310 C ${rightShoulderX} ${rightShoulderY}, 280 380, 280 480 Z`;
            torsoPath.setAttribute('d', newPath);
        });

        document.getElementById('slider-hair-puff').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('txt-hair-puff').innerText = val.toFixed(1) + 'x';
            const hair = document.getElementById('part-hair');
            hair.style.transformOrigin = "200px 90px";
            hair.style.transform = `scale(${val})`;
        });

        window.changeColor = function(part, hex) {
            if(part === 'skin') document.getElementById('part-head').setAttribute('fill', hex);
            if(part === 'clothing') document.getElementById('part-torso').setAttribute('fill', hex);
        }
    </script>
</body>
</html>
